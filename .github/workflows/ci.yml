name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR, but never on main:
# that could interrupt a docs deployment halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github src
      - name: ruff format
        if: ${{ !cancelled() }} # run even if `ruff check` failed
        run: ruff format --check --diff src

  # ---------------------------------------------------------------------------
  # 1. Docs
  # ---------------------------------------------------------------------------
  docs:
    name: Docs (sphinx)
    # Docs building runs on pushes to main or manual CI triggers.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      - name: Build HTML docs
        run: sphinx-build -W --keep-going -b html docs "$RUNNER_TEMP/docs-html"
      # Browsable copy of the docs when run manually.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: docs-html
          path: ${{ runner.temp }}/docs-html
          retention-days: 7
      # Packaged for GitHub Pages; consumed by the deploy-docs job.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/docs-html

  deploy-docs:
    name: Deploy docs (GitHub Pages)
    # Docs deployment runs only on pushes to main.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [docs, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 2. Unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest (unit)
        run: pytest -m "not e2e" -n auto

  # ---------------------------------------------------------------------------
  # 3. End-to-end tests.
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    # Runs on pushes to main or manual CI triggers.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3
      - run: pip install -e ".[dev]"
      - name: pytest (e2e)
        run: pytest -m e2e -n auto
