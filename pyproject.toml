[project]
name = "inspectre-gadget"
version = "0.0.0"
dependencies = [
  "angr>=9.2,<10",
  "PyYAML",
  "pandas",
  "tabulate",
  "bitstring>=4,<5",
  "pycparser<3"
]

[project.scripts]
inspectre = "inspectre_gadget.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
